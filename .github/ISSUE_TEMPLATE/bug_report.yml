name: Bug Report
description: 报告一个明确的 bug — 步骤可复现、实际结果与预期不符
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告 bug！请尽量提供：
        - **ccconfig 版本**（`git rev-parse HEAD`）
        - **运行环境**（Ubuntu 版本 / WSL 版本 / macOS）
        - **完整复现步骤**（命令 + 输出）
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 从 `git clone` 到 `bash maintain.sh status` 的最小流程
      placeholder: |
        1. ccconfig 拉到 ~/git/ccconfig
        2. 运行 init-base.sh all
        3. 看到报错：...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期
      description: 应该发生什么
      validations:
        required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际
      description: 实际发生了什么 + 报错原文
      validations:
        required: true
  - type: textarea
    id: env
    attributes:
      label: 环境
      description: git rev-parse HEAD / lsb_release -a / 是否有 ccprivate
      placeholder: |
        - ccconfig: $(git rev-parse HEAD)
        - OS: Ubuntu 26.04 (WSL2)
        - ccprivate: 存在 / 不存在
    validations:
      required: false
