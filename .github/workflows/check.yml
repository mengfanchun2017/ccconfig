name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  syntax:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax check (all .sh files)
        run: |
          find . -name "*.sh" -not -path "./.git/*" -not -path "./.claude/*" -print0 | xargs -0 -I{} bash -n {}

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: install linters
        run: sudo apt-get install -y -qq shellcheck shfmt
      - name: shellcheck errors (fails)
        run: |
          find . -name "*.sh" -not -path "./.git/*" -not -path "./.claude/*" -print0 \
            | xargs -0 shellcheck -S error
      - name: shellcheck warnings (info only, no fail)
        if: always()
        run: |
          find . -name "*.sh" -not -path "./.git/*" -not -path "./.claude/*" -print0 \
            | xargs -0 shellcheck -S warning || true
      - name: shfmt format check (info only, no fail)
        if: always()
        run: |
          find . -name "*.sh" -not -path "./.git/*" -not -path "./.claude/*" -print0 \
            | xargs -0 shfmt -d || true

  json:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: install jsonschema
        run: sudo apt-get install -y -qq python3-jsonschema
      - name: validate conf/*.json
        run: |
          for f in conf/*.json conf/schema/*.json; do
            [ -f "$f" ] || continue
            python3 -c "import json,sys; json.load(open('$f'))" || { echo "INVALID JSON: $f"; exit 1; }
          done
      - name: validate conf/*.json.example (well-formed JSON)
        run: |
          for f in conf/*.json.example; do
            [ -f "$f" ] || continue
            python3 -c "import json; json.load(open('$f'))" || { echo "INVALID JSON: $f"; exit 1; }
          done

  python:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: py_compile all .py
        run: |
          find . -name "*.py" -not -path "./.git/*" -not -path "./.claude/*" -print0 \
            | xargs -0 python3 -m py_compile

  bats:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: install bats
        run: sudo apt-get install -y -qq bats
      - name: bats tests
        run: bats tests/*.bats

  unit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: unit tests (mock isolated)
        run: bash tests/test-init-base.sh --verbose
      # 其余 test-*.sh 此前从不进 CI，坏了没人知道（test-init-llm.sh 曾长期假失败）
      # 2026-10-26 补全：此前仍有 13 个测试不在任何 runner 里，其中 9 个被 ADR 明确
      # 宣称"有回归覆盖"（0033/0034/0045/0050/0031/0032 + docs/init-llm.md）。
      # 尤其 test-secret-patterns.sh —— hooks/pre-commit 依赖它的自查断言守住
      # 密钥扫描的 tests/ 例外盲区，不跑等于那道护栏从未生效。
      - name: other unit suites
        run: |
          rc=0
          for f in tests/test-init-option.sh tests/test-maintain.sh tests/test-sync.sh \
                   tests/test-setup-link.sh tests/test-init-ccprivate-repo.sh \
                   tests/test-json-schema.sh tests/test-interact.sh tests/test-syntax.sh \
                   tests/test-cross-script-dryrun.sh \
                   tests/test-bootstrap.sh tests/test-monitor.sh tests/test-claude-update.sh \
                   tests/test-dry-run-argv.sh tests/test-git-pull.sh \
                   tests/test-init-llm-merge.sh tests/test-init-llm-switch.sh \
                   tests/test-mcp-pywrite.sh tests/test-node-cleanup-guard.sh \
                   tests/test-openai-bridge.sh tests/test-secret-patterns.sh \
                   tests/test-skill-init.sh \
                   tests/test-ccprivate-boundary.sh \
                   tests/test-ccprivate-sandbox-e2e.sh; do
            echo "::group::$f"
            bash "$f" || { echo "FAILED: $f"; rc=1; }
            echo "::endgroup::"
          done
          exit $rc
      - name: bridge protocol unit (python)
        run: python3 tests/test-bridge-protocol.py

  links:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: markdown 内部相对链接可达性
        run: |
          rc=0
          while IFS= read -r f; do
            dir=$(dirname "$f")
            while IFS= read -r link; do
              [ -z "$link" ] && continue
              case "$link" in http*|mailto:*|\#*) continue ;; esac
              target="${link%%#*}"
              [ -z "$target" ] && continue
              [ -e "$dir/$target" ] || { echo "BROKEN: $f -> $link"; rc=1; }
            done < <(grep -oE '\]\([^)]+\)' "$f" | sed 's/^](//; s/)$//' | sort -u)
          done < <(git ls-files '*.md')
          exit $rc

  symlink:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      # 公开仓禁止跟踪 symlink：symlink 的"内容"只是一个路径字符串，
      # 既能暴露私有路径（/home/<user>/git/ccprivate/...），clone 后还是死链，
      # 且能绕过 pre-commit 的 conf/ 白名单与密钥正则 → 等于免检通道。
      # 2026-10-26：conf/schema/mcp.schema.json 曾以 symlink 提交进公开库。
      - name: 公开仓不跟踪 symlink
        run: |
          rc=0
          git ls-files -s | awk '$1=="120000" {print "SYMLINK: " $4; found=1} END {exit found?1:0}'
          exit $rc

  deps:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: deps check
        run: bash lib/deps-check.sh --required
